name: site

on:
  push:
    branches: [main]
    paths: ["site/**", "assets/**", "brand/fonts/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site/fonts
          cp site/* _site/
          cp assets/gallery.png assets/brand/banner-dark.png assets/brand/social-preview.png assets/brand/avatar.png _site/
          cp brand/fonts/*.ttf _site/fonts/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
